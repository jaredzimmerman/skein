# skein configuration. Copy to skein.toml (or point SKEIN_CONFIG at it).
# Every key is optional; the values below are the defaults.

[server]
# Address the HTTP server binds to. Keep it on localhost and put a reverse proxy in front.
host = "127.0.0.1"
port = 8771
# Path prefix when running behind a shared reverse proxy, e.g. "/skein".
# Must be "" or start with "/" and not end with "/".
base_path = ""
# Extra allowed Host headers for MCP DNS-rebinding protection, e.g. ["skein.example.com"].
public_hosts = []
# Extra Origin header values the MCP endpoint accepts, e.g. ["https://connector.example.com"].
# Needed only if a connector sends an Origin header and gets 403.
allowed_origins = []
# Also accept ?token=... for clients that cannot send headers. Leave false if you can.
url_tokens = false
# The URL clients use to reach this server: scheme, host, then exactly base_path, no trailing
# slash, e.g. "https://skein.example.com/skein". Needed when [oauth] enabled = true.
public_url = ""

[storage]
# SQLite database file.
db = "./skein.db"
# Optional JSONL audit log path. Empty string disables it. Logs lengths, never content.
audit_log = ""

[instance]
# How assistants refer to the human who owns this queue, e.g. "Sam".
owner = "the user"
# What members are told about how quickly the point responds.
answer_time = "within about an hour"

[oauth]
# Let MCP clients that only connect through OAuth sign in as a member: the person signing in
# pastes that member's token once on skein's consent page. Fixed member tokens keep working
# either way. Needs server.public_url.
enabled = false
# Lifetime of an OAuth access token, in seconds.
access_token_ttl = 3600
# Lifetime of an OAuth refresh token, in seconds (30 days). Each refresh issues a new one.
refresh_token_ttl = 2592000
