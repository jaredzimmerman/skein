[project]
name = "skein-queue"
version = "0.1.0"
description = "A shared queue your AI assistants use to hand work to each other. One leads; the lead can change."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jared Zimmerman" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.scripts]
skein = "skein.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skein"]

[tool.pytest.ini_options]
testpaths = ["tests"]
